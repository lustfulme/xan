<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xanax Loves You</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&display=swap");

:root {
    --ink: #ff4a4a;
    --gold: #ff0000;
    --gold-deep: #7a0000;
    --iron: #000000;
    --iron-soft: rgba(0, 0, 0, 0.75);
}

body {
    margin: 0;
    height: 100vh;
    color: var(--ink);
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    background: black;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 2;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
}

h1 {
    font-size: 90px;
    font-family: "MedievalSharp", "Times New Roman", serif;
    text-transform: uppercase;
    letter-spacing: 8px;
    margin: 0;
    color: var(--gold);
    text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 0 5px #ff0000,
         0 0 10px #ff0000,
         0 0 20px #ff0000,
         0 0 40px #ff0000;
}

.subtext {
    margin-top: 20px;
    font-size: 18px;
    opacity: 0.85;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: center;
    color: #ff6b6b;
}

.scanlines {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        transparent,
        transparent 2px,
        rgba(255,0,0,0.05) 3px
    );
    pointer-events: none;
    z-index: 1;
}

.audio-controls {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--gold);
    background: var(--iron-soft);
    box-shadow: 0 0 0 1px rgba(255, 0, 0, 0.2) inset;
}

.audio-controls button,
.audio-controls input[type="range"] {
    accent-color: var(--gold);
}

.audio-controls button {
    border: 1px solid var(--gold);
    background: #0b0000;
    color: var(--ink);
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 7px 10px;
    cursor: pointer;
}

.audio-controls button:hover {
    background: #190000;
}

.audio-controls button.active {
    background: var(--gold);
    color: #000;
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
}

.audio-controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
}

.audio-status {
    min-width: 62px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--gold);
}

.audio-controls input[type="range"] {
    width: 120px;
}

@media (max-width: 700px) {
    .audio-controls {
        right: 10px;
        left: 10px;
        bottom: 10px;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .audio-controls input[type="range"] {
        width: 100px;
    }
}
</style>
</head>
<body>
<!-- NOT A REAL HTML LEL -->
<audio id="bgMusic" autoplay loop preload="auto" playsinline>
    <source src="tuff.mp3" type="audio/mpeg">
</audio>
<div class="audio-controls">
    <button id="playBtn" type="button">PLAY</button>
    <button id="pauseBtn" type="button">PAUSE</button>
    <button id="skipBtn" type="button">SKIP</button>
    <span class="audio-status" id="audioStatus">PAUSED</span>
    <label for="trackSelect">TRACK
        <select id="trackSelect" aria-label="Choose music track"></select>
    </label>
    <label for="volumeSlider">VOL
        <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1">
    </label>
</div>
<!-- NOT A REAL HTML LEL -->
<canvas id="matrix"></canvas>
<div class="scanlines"></div>
<!-- NOT A REAL HTML LEL -->
<div class="container">
    <h1>XANAX</h1>
    <div class="subtext" id="typewriter"></div>
</div>
<!-- NOT A REAL HTML LEL -->
<script>

const bgMusic = document.getElementById("bgMusic");
const playBtn = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
const skipBtn = document.getElementById("skipBtn");
const trackSelect = document.getElementById("trackSelect");
const audioStatus = document.getElementById("audioStatus");
const volumeSlider = document.getElementById("volumeSlider");

const tracks = [
    { name: "Wake up", src: "wake.mp3" },
    { name: "Comma", src: "tuff.mp3" },
    { name: "Break", src: "break.mp3" }
];

let currentTrackIndex = 0;

function populateTrackList() {
    trackSelect.innerHTML = tracks
        .map((track, index) => `<option value="${index}">${track.name}</option>`)
        .join("");
    trackSelect.value = String(currentTrackIndex);
}

function setTrack(index) {
    currentTrackIndex = (index + tracks.length) % tracks.length;
    const current = tracks[currentTrackIndex];
    const isPlaying = !bgMusic.paused;
    const wasMuted = bgMusic.muted;
    bgMusic.src = current.src;
    bgMusic.load();
    trackSelect.value = String(currentTrackIndex);
    if (isPlaying) {
        bgMusic.play().catch(() => {});
    }
    bgMusic.muted = wasMuted;
    setPlaybackState(isPlaying);
}

function setPlaybackState(isPlaying) {
    playBtn.classList.toggle("active", isPlaying);
    pauseBtn.classList.toggle("active", !isPlaying);
    audioStatus.textContent = isPlaying ? "PLAYING" : "PAUSED";
}

async function tryAutoPlay() {
    try {
        await bgMusic.play();
        setPlaybackState(true);
    } catch (err) {
        setPlaybackState(false);
    }
}

window.addEventListener("load", () => {
    populateTrackList();
    setTrack(currentTrackIndex);
    tryAutoPlay();
});

trackSelect.addEventListener("change", (event) => {
    setTrack(Number(event.target.value));
});

playBtn.addEventListener("click", tryAutoPlay);
pauseBtn.addEventListener("click", () => {
    bgMusic.pause();
    setPlaybackState(false);
});
skipBtn.addEventListener("click", () => {
    setTrack(currentTrackIndex + 1);
});

volumeSlider.addEventListener("input", (event) => {
    bgMusic.volume = Number(event.target.value);
});

bgMusic.addEventListener("play", () => setPlaybackState(true));
bgMusic.addEventListener("pause", () => setPlaybackState(false));
setPlaybackState(!bgMusic.paused);

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];
for (let x = 0; x < columns; x++) drops[x] = 1;

function drawMatrix() {
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff0000";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
            drops[i] = 0;

        drops[i]++;
    }
}
setInterval(drawMatrix, 33);


const textSets = [
    [
        "Best Haxor",
        "Most Best DDoSer",
        "Super Loved",
        "<3"
    ],
    [
        "<3 All My Homies",
        "Harming Credit Is Watching",
        "Xanax Is The Best Skid",
        "Skidding <3"
    ]
];
let currentSet = 0;
let currentLine = 0;
let currentChar = 0;
const typeElement = document.getElementById("typewriter");

function typeWriter() {
    const activeText = textSets[currentSet];

    if (currentLine < activeText.length) {
        const line = activeText[currentLine];
        if (currentChar < line.length) {
            typeElement.textContent += line.charAt(currentChar);
            currentChar++;
            setTimeout(typeWriter, 100);
        } else {
            typeElement.textContent += "\n";
            currentLine++;
            currentChar = 0;
            setTimeout(typeWriter, 500);
        }
    } else {
        setTimeout(() => {
            typeElement.textContent = "";
            currentSet = (currentSet + 1) % textSets.length;
            currentLine = 0;
            currentChar = 0;
            typeWriter();
        }, 3000);
    }
}
typeWriter();
</script>
<!-- NOT A REAL HTML LEL -->
</body>

</html>
